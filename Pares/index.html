<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pares</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-wrapper">
        <div class="glass-card">
            <header>
                <h1>Vocabulario <span class="neon-text">Pro</span></h1>
                <p>Encuentra las parejas de palabras</p>
            </header>

            <div class="stats">
                <span>Aciertos: <b id="score">0</b></span>
                <span>Intentos: <b id="tries">0</b></span>
            </div>

            <div class="grid-layout" id="game-grid">
                </div>

            <button id="reset-btn" class="glow-button">Reiniciar Desafío</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
