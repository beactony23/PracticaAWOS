<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro · AmphIQ</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <style>
    :root {
      --sage:       #8aab8e;
      --sage-light: #b4cdb7;
      --sage-pale:  #ddeedd;
      --sage-deep:  #5c8c62;
      --forest:     #2d5c34;
      --cream:      #f5f7f2;
      --charcoal:   #1e2620;
      --muted:      #6b7c6d;
      --white:      #ffffff;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--cream);
      display: flex;
      align-items: stretch;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ── CURSOR ───────────────────────────── */
    #cursor-dot {
      width: 8px; height: 8px;
      background: var(--sage-deep);
      border-radius: 50%;
      position: fixed; pointer-events: none; z-index: 9999;
      transform: translate(-50%,-50%); opacity: 0; transition: opacity .3s;
    }
    #cursor-ring {
      width: 32px; height: 32px;
      border: 1.5px solid rgba(92,140,98,.5);
      border-radius: 50%;
      position: fixed; pointer-events: none; z-index: 9998;
      transform: translate(-50%,-50%); opacity: 0;
      transition: width .3s, height .3s, opacity .3s;
    }

    /* ── LEFT PANEL ───────────────────────── */
    .auth-left {
      width: 45%;
      background: linear-gradient(155deg, #2d5c34 0%, #3d7a45 40%, #5c8c62 100%);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 4rem;
      overflow: hidden;
    }

    .auth-left::before, .auth-left::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(55px);
      animation: blobDrift 9s ease-in-out infinite alternate;
    }
    .auth-left::before {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(180,205,183,.35) 0%, transparent 70%);
      top: -120px; left: -80px;
    }
    .auth-left::after {
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(138,171,142,.25) 0%, transparent 70%);
      bottom: -60px; right: -40px;
      animation-delay: -4s; animation-duration: 12s;
    }

    @keyframes blobDrift {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(30px,25px) scale(1.08); }
    }

    .particles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .particle {
      position: absolute; border-radius: 50%;
      background: rgba(255,255,255,.15); opacity: 0;
      animation: particleFloat linear infinite;
    }
    @keyframes particleFloat {
      0%   { transform: translateY(100%) scale(0); opacity: 0; }
      10%  { opacity: .3; }
      90%  { opacity: .1; }
      100% { transform: translateY(-10%) scale(1); opacity: 0; }
    }

    .left-content { position: relative; z-index: 2; }

    .brand {
      font-family: 'DM Serif Display', serif;
      font-size: 1.6rem; color: rgba(255,255,255,.9);
      margin-bottom: 3.5rem; letter-spacing: -.5px;
      opacity: 0; animation: fadeUp .6s .1s forwards;
    }

    .left-heading {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(2.2rem, 3.5vw, 3.2rem);
      color: var(--white); line-height: 1.1; margin-bottom: 1.2rem;
      opacity: 0; animation: fadeUp .7s .3s forwards;
    }
    .left-heading span { color: var(--sage-pale); font-style: italic; }

    .left-sub {
      color: rgba(255,255,255,.65); font-size: 1rem;
      line-height: 1.65; max-width: 320px; margin-bottom: 3rem;
      opacity: 0; animation: fadeUp .7s .5s forwards;
    }

    .feature-pills {
      display: flex; flex-direction: column; gap: .75rem;
      opacity: 0; animation: fadeUp .7s .7s forwards;
    }
    .pill {
      display: inline-flex; align-items: center; gap: .7rem;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      border-radius: 100px; padding: .55rem 1rem;
      color: rgba(255,255,255,.85); font-size: .85rem; font-weight: 500;
      width: fit-content; backdrop-filter: blur(6px);
      transition: background .25s, transform .25s;
    }
    .pill:hover { background: rgba(255,255,255,.18); transform: translateX(4px); }
    .pill i { font-size: 1rem; color: var(--sage-pale); }

    /* ── RIGHT PANEL ──────────────────────── */
    .auth-right {
      flex: 1; display: flex; align-items: center;
      justify-content: center; padding: 3rem 2rem;
      background: var(--cream); position: relative;
      overflow-y: auto;
    }

    .form-card {
      width: 100%; max-width: 420px;
      opacity: 0; animation: fadeIn .8s .4s forwards;
    }

    .form-card .greet {
      font-size: .8rem; font-weight: 700; letter-spacing: .12em;
      text-transform: uppercase; color: var(--sage-deep); margin-bottom: .5rem;
    }
    .form-card h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem; color: var(--forest); margin-bottom: .4rem;
    }
    .form-card .subtitle {
      font-size: .9rem; color: var(--muted); margin-bottom: 1.8rem;
    }
    .form-card .subtitle a {
      color: var(--sage-deep); font-weight: 600; text-decoration: none;
      border-bottom: 1px solid transparent; transition: border-color .2s;
    }
    .form-card .subtitle a:hover { border-color: var(--sage-deep); }

    /* ── ALERT ────────────────────────────── */
    .alert {
      display: none;
      padding: .8rem 1rem;
      border-radius: 10px;
      font-size: .88rem;
      margin-bottom: 1.2rem;
      text-align: center;
    }
    .alert.error {
      background: #fdf0f0; border: 1px solid #f5c6cb; color: #721c24;
      animation: shakeX .4s ease;
    }
    .alert.success {
      background: #eaf5eb; border: 1px solid #b4cdb7; color: var(--forest);
      animation: fadeUp .4s ease;
    }
    @keyframes shakeX {
      0%,100%{ transform: translateX(0); }
      20%    { transform: translateX(-6px); }
      40%    { transform: translateX(6px); }
      60%    { transform: translateX(-4px); }
      80%    { transform: translateX(4px); }
    }

    /* ── INPUTS ───────────────────────────── */
    .input-group-field { margin-bottom: 1.1rem; }
    .input-group-field label {
      display: block; font-size: .82rem; font-weight: 600;
      color: var(--charcoal); margin-bottom: .4rem; letter-spacing: .02em;
      transition: color .2s;
    }

    .input-wrap { position: relative; }
    .input-wrap > i.field-icon {
      position: absolute; left: 1rem; top: 50%;
      transform: translateY(-50%); color: var(--sage);
      font-size: 1rem; pointer-events: none; transition: color .2s;
    }
    .input-wrap input {
      width: 100%;
      padding: .82rem 1rem .82rem 2.8rem;
      border: 1.5px solid rgba(138,171,142,.35);
      border-radius: 12px; background: var(--white);
      font-family: 'Outfit', sans-serif; font-size: .95rem;
      color: var(--charcoal); outline: none;
      transition: border-color .25s, box-shadow .25s;
    }
    .input-wrap input::placeholder { color: #afc4b1; }
    .input-wrap input:focus {
      border-color: var(--sage-deep);
      box-shadow: 0 0 0 3px rgba(92,140,98,.15);
    }
    .input-wrap:focus-within > i.field-icon { color: var(--sage-deep); }

    /* password strength bar */
    .strength-bar {
      height: 4px; border-radius: 4px;
      background: rgba(138,171,142,.2);
      margin-top: .5rem; overflow: hidden;
    }
    .strength-fill {
      height: 100%; border-radius: 4px; width: 0;
      transition: width .4s, background .4s;
    }
    .strength-label {
      font-size: .75rem; color: var(--muted); margin-top: .25rem;
      min-height: 1rem;
    }

    /* toggle pass */
    .toggle-pass {
      position: absolute; right: 1rem; top: 50%;
      transform: translateY(-50%); color: var(--muted);
      cursor: pointer; background: none; border: none;
      padding: 0; font-size: 1rem; transition: color .2s;
    }
    .toggle-pass:hover { color: var(--forest); }

    /* match indicator */
    .match-hint {
      font-size: .75rem; margin-top: .3rem; min-height: 1rem;
      transition: color .2s;
    }

    /* ── SUBMIT ───────────────────────────── */
    .btn-submit {
      width: 100%; padding: .9rem;
      background: var(--forest); color: var(--white);
      border: none; border-radius: 12px;
      font-family: 'Outfit', sans-serif; font-size: 1rem; font-weight: 600;
      cursor: pointer; letter-spacing: .02em; margin-top: .4rem;
      position: relative; overflow: hidden;
      transition: background .25s, transform .2s, box-shadow .25s;
      box-shadow: 0 6px 20px rgba(45,92,52,.28);
      display: flex; align-items: center; justify-content: center; gap: .5rem;
    }
    .btn-submit:hover:not(:disabled) {
      background: var(--sage-deep); transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(45,92,52,.35);
    }
    .btn-submit:disabled { opacity: .65; cursor: not-allowed; }
    .btn-submit:active:not(:disabled) { transform: translateY(0); }

    .ripple {
      position: absolute; border-radius: 50%;
      background: rgba(255,255,255,.3); transform: scale(0);
      animation: rippleAnim .5s linear; pointer-events: none;
    }
    @keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }

    .spinner {
      display: none; width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff; border-radius: 50%;
      animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .bottom-link {
      text-align: center; font-size: .85rem;
      color: var(--muted); margin-top: 1.4rem;
    }
    .bottom-link a { color: var(--sage-deep); font-weight: 600; text-decoration: none; }

    /* ── SHARED KEYFRAMES ─────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(20px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* ── RESPONSIVE ───────────────────────── */
    @media (max-width: 768px) {
      body { flex-direction: column; overflow: auto; }
      .auth-left { width: 100%; padding: 3rem 2rem 2.5rem; min-height: 40vh; }
      .auth-right { padding: 2.5rem 1.5rem 4rem; overflow-y: visible; }
      .feature-pills { flex-direction: row; flex-wrap: wrap; }
    }
  </style>
</head>
<body>

<div id="cursor-dot"></div>
<div id="cursor-ring"></div>

<!-- ── LEFT ──────────────────────────────── -->
<div class="auth-left">
  <div class="particles" id="particles"></div>
  <div class="left-content">
    <div class="brand">AmphIQ</div>
    <h1 class="left-heading">
      Crea tu<br><span>cuenta</span><br>hoy.
    </h1>
    <p class="left-sub">
      Únete a miles de usuarios que ya aprenden de forma interactiva y a su propio ritmo.
    </p>
    <div class="feature-pills">
      <div class="pill"><i class="bi bi-lightning-charge"></i> Aprendizaje interactivo</div>
      <div class="pill"><i class="bi bi-bar-chart-line"></i> Sigue tu progreso</div>
      <div class="pill"><i class="bi bi-shield-check"></i> Cuenta segura</div>
    </div>
  </div>
</div>

<!-- ── RIGHT ─────────────────────────────── -->
<div class="auth-right">
  <div class="form-card">

    <div class="greet">Plataforma educativa</div>
    <h2>Crear cuenta</h2>
    <p class="subtitle">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>

    <div class="alert" id="alerta"></div>

    <form id="frmRegister">

      <!-- Nombre -->
      <div class="input-group-field">
        <label>Nombre</label>
        <div class="input-wrap">
          <input type="text" name="user" placeholder="Tu nombre completo" required>
          <i class="bi bi-person field-icon"></i>
        </div>
      </div>

      <!-- Email -->
      <div class="input-group-field">
        <label>Correo electrónico</label>
        <div class="input-wrap">
          <input type="email" name="email" placeholder="correo@ejemplo.com" required>
          <i class="bi bi-envelope field-icon"></i>
        </div>
      </div>

      <!-- Contraseña -->
      <div class="input-group-field">
        <label>Contraseña</label>
        <div class="input-wrap">
          <input type="password" name="pass" id="passInput"
                 placeholder="••••••••" required minlength="8"
                 pattern="(?=.*[A-Z])(?=.*[0-9])(?=.*[\W_]).{8,}"
                 title="Mínimo 8 caracteres, una mayúscula, un número y un símbolo">
          <i class="bi bi-lock field-icon"></i>
          <button type="button" class="toggle-pass" data-target="passInput">
            <i class="bi bi-eye"></i>
          </button>
        </div>
        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
        <div class="strength-label" id="strengthLabel"></div>
      </div>

      <!-- Confirmar contraseña -->
      <div class="input-group-field">
        <label>Confirmar contraseña</label>
        <div class="input-wrap">
          <input type="password" name="pass2" id="pass2Input"
                 placeholder="••••••••" required>
          <i class="bi bi-lock-fill field-icon"></i>
          <button type="button" class="toggle-pass" data-target="pass2Input">
            <i class="bi bi-eye"></i>
          </button>
        </div>
        <div class="match-hint" id="matchHint"></div>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">
        <span id="btnText">Registrarse</span>
        <div class="spinner" id="spinner"></div>
      </button>

    </form>

    <div class="bottom-link">
      <a href="login.html">¿Ya tienes cuenta? Inicia sesión →</a>
    </div>

  </div>
</div>

<script>
  /* ── Cursor ── */
  const dot = document.getElementById('cursor-dot');
  const ring = document.getElementById('cursor-ring');
  let rx = 0, ry = 0;

  document.addEventListener('mousemove', e => {
    dot.style.opacity = ring.style.opacity = '1';
    dot.style.left = e.clientX + 'px';
    dot.style.top  = e.clientY + 'px';
  });
  (function loop() {
    rx += (parseFloat(dot.style.left) || 0 - rx) * .13;
    ry += (parseFloat(dot.style.top)  || 0 - ry) * .13;
    ring.style.left = rx + 'px';
    ring.style.top  = ry + 'px';
    requestAnimationFrame(loop);
  })();
  document.querySelectorAll('a,button,input').forEach(el => {
    el.addEventListener('mouseenter', () => ring.style.width = ring.style.height = '46px');
    el.addEventListener('mouseleave', () => ring.style.width = ring.style.height = '32px');
  });

  /* ── Particles ── */
  const pc = document.getElementById('particles');
  for (let i = 0; i < 14; i++) {
    const p = document.createElement('div');
    p.classList.add('particle');
    const s = Math.random() * 7 + 3;
    p.style.cssText = `width:${s}px;height:${s}px;left:${Math.random()*100}%;animation-duration:${Math.random()*12+7}s;animation-delay:${Math.random()*8}s;`;
    pc.appendChild(p);
  }

  /* ── Label focus highlight ── */
  document.querySelectorAll('.input-wrap input').forEach(inp => {
    inp.addEventListener('focus', () => {
      inp.closest('.input-group-field').querySelector('label').style.color = 'var(--forest)';
    });
    inp.addEventListener('blur', () => {
      inp.closest('.input-group-field').querySelector('label').style.color = '';
    });
  });

  /* ── Toggle password ── */
  document.querySelectorAll('.toggle-pass').forEach(btn => {
    btn.addEventListener('click', () => {
      const inp  = document.getElementById(btn.dataset.target);
      const icon = btn.querySelector('i');
      inp.type   = inp.type === 'password' ? 'text' : 'password';
      icon.className = inp.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
    });
  });

  /* ── Password strength ── */
  const passInput     = document.getElementById('passInput');
  const strengthFill  = document.getElementById('strengthFill');
  const strengthLabel = document.getElementById('strengthLabel');

  passInput.addEventListener('input', () => {
    const v = passInput.value;
    let score = 0;
    if (v.length >= 8)            score++;
    if (/[A-Z]/.test(v))         score++;
    if (/[0-9]/.test(v))         score++;
    if (/[\W_]/.test(v))         score++;

    const levels = [
      { pct: '0%',   color: 'transparent',      text: '' },
      { pct: '25%',  color: '#e74c3c',           text: 'Muy débil' },
      { pct: '50%',  color: '#e67e22',           text: 'Débil' },
      { pct: '75%',  color: 'var(--sage)',        text: 'Buena' },
      { pct: '100%', color: 'var(--sage-deep)',   text: '¡Contraseña fuerte!' },
    ];

    strengthFill.style.width      = levels[score].pct;
    strengthFill.style.background = levels[score].color;
    strengthLabel.textContent     = levels[score].text;
    strengthLabel.style.color     = levels[score].color;
  });

  /* ── Password match ── */
  const pass2Input = document.getElementById('pass2Input');
  const matchHint  = document.getElementById('matchHint');

  pass2Input.addEventListener('input', checkMatch);
  passInput.addEventListener('input',  checkMatch);

  function checkMatch() {
    if (!pass2Input.value) { matchHint.textContent = ''; return; }
    const ok = passInput.value === pass2Input.value;
    matchHint.textContent = ok ? '✓ Las contraseñas coinciden' : '✗ Las contraseñas no coinciden';
    matchHint.style.color = ok ? 'var(--sage-deep)' : '#e74c3c';
    pass2Input.style.borderColor = ok ? 'var(--sage-deep)' : '#e74c3c';
  }

  /* ── Ripple ── */
  document.getElementById('btnSubmit').addEventListener('click', function(e) {
    const r = document.createElement('span');
    const rect = this.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    r.classList.add('ripple');
    r.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px;`;
    this.appendChild(r);
    setTimeout(() => r.remove(), 600);
  });

  /* ── Form submit → fetch a register.php ── */
  function showAlert(msg, type) {
    const el = document.getElementById('alerta');
    el.textContent = msg;
    el.className   = `alert ${type}`;
    el.style.display = 'block';
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  document.getElementById('frmRegister').addEventListener('submit', async function(e) {
    e.preventDefault();

    const btn     = document.getElementById('btnSubmit');
    const txt     = document.getElementById('btnText');
    const spinner = document.getElementById('spinner');

    // loading state
    btn.disabled      = true;
    txt.textContent   = 'Registrando...';
    spinner.style.display = 'block';

    try {
      const res  = await fetch('register.php', {
        method: 'POST',
        body:   new FormData(this)
      });
      const data = await res.json();

      if (data.ok) {
        showAlert('¡Cuenta creada exitosamente! Redirigiendo...', 'success');
        setTimeout(() => window.location = 'login.html?status=success', 1800);
      } else {
        showAlert(data.error || 'Error desconocido', 'error');
        btn.disabled = false;
        txt.textContent = 'Registrarse';
        spinner.style.display = 'none';
      }

    } catch (err) {
      showAlert('Error de conexión. Intenta de nuevo.', 'error');
      btn.disabled = false;
      txt.textContent = 'Registrarse';
      spinner.style.display = 'none';
    }
  });
</script>
</body>
</html>
