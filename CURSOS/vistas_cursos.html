<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Cursos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center mb-4">📘 REGISTRO DE CURSOS</h2>

    <div class="card p-4 shadow-sm mb-4">
        <form id="formCurso"> <input type="hidden" name="txtid" id="txtid">
            
            <div class="mb-3">
                <label class="form-label fw-bold">Nombre del curso:</label>
                <input type="text" name="txtnombre" id="txtnombre" class="form-control" placeholder="Escribe el nombre del curso..." required>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success" id="btnGuardar">Guardar</button>
                <button type="button" class="btn btn-secondary" id="btnCancelar">✕ Cancelar</button>
            </div>
        </form>
    </div>

    <div class="card p-3 shadow-sm mb-4">
        <form method="GET" action="vistas_cursos.html">
            <div class="input-group">
                <input type="text" name="txtbuscar" class="form-control" placeholder="Buscar curso...">
                <button type="submit" class="btn btn-primary">Buscar</button>
                <a href="vistas_cursos.html" class="btn btn-outline-secondary">Limpiar</a>
            </div>
        </form>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-bordered table-hover text-center mb-0">
                <thead class="table-dark">
                    <tr>
                        <th style="width: 15%;">ID</th>
                        <th>Nombre del Curso</th>
                        <th style="width: 25%;">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaCursos">
                    <tr>
                        <td colspan="3" class="text-muted">Cargando cursos...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
