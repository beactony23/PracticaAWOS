<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Respuestas - AmphIQ Style</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Diseño.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

<div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
</div>

<div class="particles" id="particles"></div>

<header class="edu-header">
    <div class="edu-logo">🎓</div>
    <div class="edu-brand">
        Gestión de
        <span>Respuestas</span>
    </div>
</header>

<nav class="nav-pills-edu">
    <button onclick="buscarRespuestas()" class="nav-pill np-2" style="border:none;">📋 Ver Todas</button>
    
    <button id="btnSinRespuesta" class="nav-pill np-1" style="border:none;">📊 Sin Respuesta</button>
    <button id="btnTotal" class="nav-pill np-3" style="border:none;">📈 Ver Total</button>
    <a href="../index.html" class="nav-pill np-4">🏠 Inicio</a>

    <a id="btnIniciarSesion" class="btn btn-outline-info nav-pill np-3" style="visibility: hidden;" href="../Login.html">Iniciar Sesión</a>

    <button id="btnCerrarSesion" class="btn btn-outline-danger nav-pill np-3" style="visibility: hidden;">Cerrar Sesión</button>

</nav>

<div class="main-layout">
    <div class="edu-card">
        <div class="card-header-edu">
            <div class="icon-badge ib-purple">✏️</div>
            <h2>Nueva Respuesta</h2>
        </div>
        <div class="card-body-edu">
            <form id="frmRespuesta" method="POST">
                <div class="form-group">
                    <label for="txtId" class="form-label-edu">ID</label>
                    <input type="text" id="txtId" name="txtId" class="form-control-edu" readonly placeholder="Auto-generado">
                </div>

                <div class="form-group">
                    <label for="txtRespuesta" class="form-label-edu">Respuesta</label>
                    <input type="text" id="txtRespuesta" name="txtRespuesta" class="form-control-edu" placeholder="Escribe la respuesta…">
                </div>

                <div class="form-group">
                    <label for="cboPregunta" class="form-label-edu">Pregunta</label>
                    <div class="select-wrap">
                        <select id="cboPregunta" name="cboPregunta" class="form-control-edu form-select-edu">
                            <option value="">Selecciona una pregunta</option>
                        </select>
                    </div>
                </div>

                <div style="display:flex; gap:10px; margin-top:20px;">
                    <button type="submit" class="btn-edu btn-save">💾 Guardar</button>
                    <button type="reset" class="btn-edu btn-cancel">✕ Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <div class="edu-card">
        <div class="card-header-edu">
            <div style="display:flex;align-items:center;gap:10px;">
                <div class="icon-badge ib-teal">📋</div>
                <h2 class="table-title">Registro de Respuestas</h2>
            </div>
        </div>
        <div class="card-body-edu" style="padding:16px;">
            <div class="table-wrap">
                <table class="edu-table">
                    <thead>
                        <tr>
                            <th>Pregunta</th>
                            <th>Respuesta</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyRespuestas">
                        </tbody>
                </table>    
            </div>
        </div>
    </div>
</div>

<script src="main.js" defer></script>
<script>
    // Partículas de fondo
    (function() {
        const colors = ['#6c63ff','#ff6584','#43d9ad','#ffbe0b'];
        const container = document.getElementById('particles');
        for (let i = 0; i < 20; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const size = Math.random() * 12 + 5;
            p.style.cssText = `
                width:${size}px; height:${size}px;
                background:${colors[Math.floor(Math.random()*colors.length)]};
                left:${Math.random()*100}vw;
                animation-duration:${Math.random()*14+8}s;
                opacity:0.3;
            `;
            container.appendChild(p);
        }
    })();

    // MutationObserver para aplicar estilos a los botones que vienen de la BD
    window.addEventListener('DOMContentLoaded', function() {
        const tbody = document.getElementById('tbodyRespuestas');
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(m => {
                m.addedNodes.forEach(node => {
                    if (node.nodeType !== 1) return;
                    node.querySelectorAll('.btn-editar').forEach(btn => {
                        btn.className = 'btn-row btn-row-edit btn-editar';
                        if (!btn.textContent.includes('✏️')) btn.innerHTML = '✏️ Editar';
                    });
                    node.querySelectorAll('.btn-eliminar').forEach(btn => {
                        btn.className = 'btn-row btn-row-del btn-eliminar';
                        if (!btn.textContent.includes('🗑️')) btn.innerHTML = '🗑️ Eliminar';
                    });
                });
            });
        });
        observer.observe(tbody, { childList: true, subtree: true });
    });
</script>
</body>
</html>
